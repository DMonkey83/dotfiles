# NOTE: Samsung on HDMI-A-1 caps at 340 MHz TMDS (EDID), so 4K60 RGB (594 MHz) is
# impossible - forcing it made the connector flap every ~5s. @30 is its native mode.
# 4K60 is only available on this panel as YCbCr 4:2:0. Do not remove the @30.
monitor = HDMI-A-1, 3840x2160@30, 0x0, 1
monitor = DP-2, 3840x2160, 3840x0, 1
